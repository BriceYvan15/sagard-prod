# ─────────────────────────────────────────────────────────────────────────
#  SAGARD SÉCURITÉ — Nginx reverse proxy (VPS 2.24.122.62)
#
#  Frontend (static) → /opt/sagard/frontend/dist
#  Backend API (127.0.0.1:3002) → /api/*
#
#  Déploiement :
#    cp → /etc/nginx/sites-available/sagard
#    ln -s /etc/nginx/sites-available/sagard /etc/nginx/sites-enabled/sagard
#    nginx -t && systemctl reload nginx
# ─────────────────────────────────────────────────────────────────────────

upstream sagard_api { server 127.0.0.1:3002; keepalive 16; }

server {
    listen 80;
    listen [::]:80;
    server_name 2.24.122.62;

    client_max_body_size 25m;

    # ── API backend ──────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://sagard_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
    }

    # ── Frontend SPA ─────────────────────────────────────────────────────
    location / {
        root /opt/sagard/frontend/dist;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 30d;
            add_header Cache-Control "public, immutable";
        }
    }
}
