name: Deploy Backend

# Déploiement automatique de l'API SAGARD (NestJS) sur le VPS.
# Se déclenche à chaque push sur `main` (après merge d'une PR) ou manuellement.
# Un seul déploiement à la fois (concurrency).

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Version de pnpm lue depuis "packageManager" dans package.json (pnpm@9.1.0)
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prisma generate
        run: npx prisma@5.22.0 generate --schema=packages/database/prisma/schema.prisma

      - name: Build API
        run: cd apps/api && pnpm exec nest build

      - name: Load SSH key (ssh-agent)
        uses: webfactory/ssh-agent@e3f1a8e046525bfed3725ef54a31ca91aed399f4 # v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Deploy to VPS
        env:
          HOST: ${{ secrets.SSH_HOST }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          SMTP_FROM_NAME: ${{ secrets.SMTP_FROM_NAME }}
        run: |
          SSH="ssh -o StrictHostKeyChecking=accept-new -o BatchMode=yes"
          # Sauvegarde de l'existant (rollback possible)
          $SSH root@"$HOST" "mkdir -p /opt/sagard/_backups && tar czf /opt/sagard/_backups/api-dist-\$(date +%Y%m%d-%H%M%S).tar.gz -C /opt/sagard/api/apps/api dist || true"
          # Envoi du build compilé
          rsync -az --delete -e "$SSH" apps/api/dist/ root@"$HOST":/opt/sagard/api/apps/api/dist/
          # Envoi du schéma Prisma et des migrations
          rsync -az -e "$SSH" packages/database/prisma/ root@"$HOST":/opt/sagard/api/packages/database/prisma/
          # Créer/mettre à jour le .env pour la migration
          $SSH root@"$HOST" "echo 'DATABASE_URL=$DATABASE_URL' > /opt/sagard/api/packages/database/.env"
          # Créer/mettre à jour le .env de l'API (SMTP + DB)
          $SSH root@"$HOST" "cat > /opt/sagard/api/apps/api/.env <<ENVEOF
DATABASE_URL=$DATABASE_URL
SMTP_HOST=$SMTP_HOST
SMTP_PORT=$SMTP_PORT
SMTP_USER=$SMTP_USER
SMTP_PASS=$SMTP_PASS
SMTP_FROM_NAME=$SMTP_FROM_NAME
ENVEOF"

          # --- OPTIONNEL : à activer quand le package.json backend change (nouvelles dépendances) ---
          # rsync -az -e "$SSH" package.json pnpm-lock.yaml apps/api/package.json root@"$HOST":/opt/sagard/api/
          # $SSH root@"$HOST" "cd /opt/sagard/api && pnpm install --prod --frozen-lockfile"

          # --- Migration Prisma : marquer les migrations échouées comme résolues, puis appliquer ---
          $SSH root@"$HOST" "cd /opt/sagard/api && npx prisma@5.22.0 migrate resolve --rolled-back 20260723160000_treasury_management --schema=packages/database/prisma/schema.prisma 2>/dev/null || true"
          # Compléter la migration training_sessions si elle a été partiellement appliquée (ALTER TYPE manquant)
          $SSH root@"$HOST" "cd /opt/sagard/api && set -a && source packages/database/.env && set +a && psql \"\$DATABASE_URL\" -c \"ALTER TYPE \\\"NotificationType\\\" ADD VALUE IF NOT EXISTS 'FORMATION';\" || true"
          $SSH root@"$HOST" "cd /opt/sagard/api && set -a && source packages/database/.env && set +a && psql \"\$DATABASE_URL\" -c \"ALTER TYPE \\\"NotificationType\\\" ADD VALUE IF NOT EXISTS 'CONGE';\" || true"
          $SSH root@"$HOST" "cd /opt/sagard/api && npx prisma@5.22.0 migrate resolve --applied 20260801150000_training_sessions --schema=packages/database/prisma/schema.prisma 2>/dev/null || true"
          $SSH root@"$HOST" "cd /opt/sagard/api && npx prisma@5.22.0 migrate deploy --schema=packages/database/prisma/schema.prisma"
          # Régénérer le client Prisma sur le serveur avec le nouveau schéma
          $SSH root@"$HOST" "cd /opt/sagard/api && npx prisma@5.22.0 generate --schema=packages/database/prisma/schema.prisma"

          # Redémarrage du service PM2
          $SSH root@"$HOST" "pm2 restart sagard-api --update-env"
          echo "✅ Backend déployé et redémarré."
